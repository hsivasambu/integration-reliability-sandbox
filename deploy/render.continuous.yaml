# PREPARED, NOT ACTIVE. Continuous-running variant of render.yaml.
# Render only reads render.yaml in the repository root, so this file changes nothing by itself.
# To use it (this BUYS a paid instance; get explicit approval first):
#   copy deploy/render.continuous.yaml over render.yaml, commit, push.
# Differences from render.yaml: a paid always-on instance type, and migrations in a pre-deploy step.
services:
  - type: web
    name: integration-reliability-sandbox
    runtime: node
    plan: 0.5c-512mb      # smallest paid instance ("Starter"); paid instances do not spin down. COSTS MONEY.
    region: oregon
    branch: main
    buildCommand: npm ci
    preDeployCommand: npm run migrate   # paid instances support a pre-deploy step
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: integration-reliability-sandbox-db
          property: connectionString   # internal (private network) URL
      # Migrations run in preDeployCommand instead of at startup.
      - key: MIGRATE_ON_START
        value: "false"
      # Render's proxy sits in front of the app; trust one hop for client IPs.
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: MAX_EVENTS_PER_SESSION
        value: "100"
      # Secret for internal mock receiver calls. Render generates a random value once;
      # it is never committed and never sent to browsers.
      - key: RECEIVER_SECRET
        generateValue: true
      - key: DELIVERY_TIMEOUT_MS
        value: "2000"
      - key: RECEIVER_SLOW_RESPONSE_MS
        value: "4000"
      # RECEIVER_URL is not set: the app calls its own receiver at http://127.0.0.1:$PORT.
      # Run the delivery worker inside this web process (no separate worker service).
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_POLL_INTERVAL_MS
        value: "1000"
      - key: DELIVERY_LEASE_MS
        value: "15000"
      # 4 attempts in total (original + 3 retries), retried after 2 s, 4 s, 8 s.
      - key: DELIVERY_MAX_ATTEMPTS
        value: "4"
      - key: RETRY_BASE_DELAY_MS
        value: "2000"
      - key: WORKER_CONCURRENCY
        value: "2"
      # Manual replays allowed per event.
      - key: MAX_REPLAYS_PER_EVENT
        value: "3"
      # Operations (Stage 10).
      - key: LOG_LEVEL
        value: info
      # Private worker/queue check at /internal/ops/worker. Render generates the value once;
      # read it in the dashboard (Environment). Never commit it.
      - key: OPS_TOKEN
        generateValue: true
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "600"
      - key: CLEANUP_INTERVAL_MS
        value: "60000"
      - key: CLEANUP_BATCH_SIZE
        value: "100"
      - key: EXPIRED_RETENTION_MINUTES
        value: "60"
    # PORT is set by Render (default 10000); HOST defaults to 0.0.0.0 in code.
    # Node version comes from .node-version (24).

databases:
  - name: integration-reliability-sandbox-db
    plan: free            # STILL EXPIRES after 30 days. For long-term continuous use, upgrade the
                          # database to a paid plan in the dashboard (also costs money).
    region: oregon        # same region as the web service for the private network
    postgresMajorVersion: "18"
    databaseName: sandbox
    user: sandbox
    ipAllowList: []       # no external connections; only Render services can connect
