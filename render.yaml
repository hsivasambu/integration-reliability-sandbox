# Render Blueprint: https://render.com/docs/blueprint-spec
# Pushing changes to this file makes Render create/update the resources below.
services:
  - type: web
    name: integration-reliability-sandbox
    runtime: node
    plan: free            # no cost; sleeps after 15 min idle (see README)
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: integration-reliability-sandbox-db
          property: connectionString   # internal (private network) URL
      # Free instances have no pre-deploy command, so migrations run at startup.
      # On a paid instance, remove this and add: preDeployCommand: npm run migrate
      - key: MIGRATE_ON_START
        value: "true"
      # Render's proxy sits in front of the app; trust one hop for client IPs.
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: MAX_EVENTS_PER_SESSION
        value: "100"
      # Secret for internal mock receiver calls. Render generates a random value once;
      # it is never committed and never sent to browsers.
      - key: RECEIVER_SECRET
        generateValue: true
      - key: DELIVERY_TIMEOUT_MS
        value: "2000"
      - key: RECEIVER_SLOW_RESPONSE_MS
        value: "4000"
      # RECEIVER_URL is not set: the app calls its own receiver at http://127.0.0.1:$PORT.
      # Run the delivery worker inside this web process (no separate worker service).
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_POLL_INTERVAL_MS
        value: "1000"
      - key: DELIVERY_LEASE_MS
        value: "15000"
      # 4 attempts in total (original + 3 retries), retried after 2 s, 4 s, 8 s.
      - key: DELIVERY_MAX_ATTEMPTS
        value: "4"
      - key: RETRY_BASE_DELAY_MS
        value: "2000"
      - key: WORKER_CONCURRENCY
        value: "2"
      # Manual replays allowed per event.
      - key: MAX_REPLAYS_PER_EVENT
        value: "3"
    # PORT is set by Render (default 10000); HOST defaults to 0.0.0.0 in code.
    # Node version comes from .node-version (24).

databases:
  - name: integration-reliability-sandbox-db
    plan: free            # no cost; expires 30 days after creation, no backups
    region: oregon        # same region as the web service for the private network
    postgresMajorVersion: "18"
    databaseName: sandbox
    user: sandbox
    ipAllowList: []       # no external connections; only Render services can connect
