# Local PostgreSQL for development and tests. Not used in deployment.
# Values come from .env (copy .env.example). Data persists in the "pgdata" volume.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sandbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sandbox
    ports:
      # Bound to localhost only; 5433 avoids clashing with any locally installed Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sandbox"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
